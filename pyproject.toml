[project]
name = "engram"
version = "5.3.1"
description = "Agent memory modelled after a database: the agent says what to store and what it wants back, an engine with fixed rules decides how."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy",
    "zstandard",
    "sentence-transformers",
    "torch",
    "tiktoken>=0.14.0",
]

[project.optional-dependencies]
eval = ["httpx", "python-dotenv"]   # the benchmark harness (answering model, judge, the agent's model)

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engram"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
